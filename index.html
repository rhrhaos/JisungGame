<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Mini Survivor (Mobile)</title>
<style>
  html,body{margin:0;height:100%;background:#0e0e0e;color:#eee;font-family:system-ui;touch-action:none;overscroll-behavior:none}
  #wrap{height:100%;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;border:1px solid #333;border-radius:12px;display:block;max-width:100vw;max-height:100vh}
  .hud{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.55);border:1px solid #333;border-radius:12px;padding:10px;font-size:13px;line-height:1.45;min-width:240px}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.65);z-index:50}
  .panel{background:#111;border:1px solid #333;border-radius:14px;padding:16px;min-width:min(560px,92vw);max-width:min(760px,92vw)}
  .choices{display:grid;gap:10px}
  button{background:#181818;color:#eee;border:1px solid #444;border-radius:10px;padding:12px;cursor:pointer;text-align:left}
  button:hover{border-color:#888}
  .center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:60}
  input{padding:10px 12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff;width:min(320px,80vw)}
  .row{display:flex;gap:10px;margin-top:10px}
  .row button{flex:1;text-align:center}
  .small{opacity:.82;font-size:12px;margin-top:8px;line-height:1.35}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:rgba(0,0,0,.75);border:1px solid #333;padding:10px 12px;border-radius:12px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap;z-index:70}
  .tag{display:inline-block;padding:2px 8px;border:1px solid #333;border-radius:999px;font-size:12px;opacity:.9;margin-right:6px}

  /* Mobile joystick */
  .joyWrap{
    position:fixed;left:14px;bottom:14px;width:140px;height:140px;border-radius:50%;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    display:none;z-index:40;
  }
  .joyBase{
    position:absolute;inset:18px;border-radius:50%;
    border:1px solid rgba(255,255,255,.10);
    background:rgba(0,0,0,.18);
  }
  .joyKnob{
    position:absolute;left:50%;top:50%;width:52px;height:52px;margin-left:-26px;margin-top:-26px;border-radius:50%;
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
  }
  .mobileHint{
    position:fixed;right:12px;bottom:12px;background:rgba(0,0,0,.5);border:1px solid #333;border-radius:12px;padding:10px;font-size:12px;opacity:.9;z-index:40;
    display:none;
  }
</style>
</head>
<body>

<div class="hud" id="hud"></div>
<div class="toast" id="toast"></div>

<div id="wrap">
  <canvas id="c"></canvas>
</div>

<!-- Mobile joystick UI -->
<div class="joyWrap" id="joyWrap">
  <div class="joyBase"></div>
  <div class="joyKnob" id="joyKnob"></div>
</div>
<div class="mobileHint" id="mobileHint">조이스틱으로 이동<br/>레벨업은 선택지 탭</div>

<div id="levelup" class="overlay">
  <div class="panel">
    <h3 style="margin:0 0 10px;">레벨 업 <span class="tag">↑↓ / W,S</span><span class="tag">Space</span><span class="tag">모바일: 탭</span></h3>
    <div id="choices" class="choices"></div>
    <div class="small" id="levelHint"></div>
  </div>
</div>

<div id="gameover" class="overlay">
  <div class="panel">
    <h2 id="goTitle" style="margin:0 0 6px;"></h2>
    <div class="small" id="goBody" style="white-space:pre-wrap"></div>
    <div class="row" style="margin-top:12px;">
      <button id="retryBtn">다시하기</button>
      <button id="copyBtn">런 결과 복사(리더보드용)</button>
    </div>
    <div class="small">Firebase 붙일 때는 <b>submitRun(payload)</b>만 연결</div>
  </div>
</div>

<div id="start" class="center">
  <div class="panel">
    <h3 style="margin:0 0 10px;">닉네임 / 캐릭터 선택</h3>
    <input id="nameInput" placeholder="닉네임" />
    <div class="row">
      <button id="pickRanged">원거리</button>
      <button id="pickNinja">회전 칼날 닌자</button>
    </div>
    <div class="small">
      원거리: 원소/시너지 + 탄막 성장<br/>
      닌자: 근접 링 타격 + 빌드 누적형 장비(단, 동시타격 제한으로 밸런스)
    </div>
  </div>
</div>

<script>
/* =========================
   0) 캔버스 리사이즈(모바일 대응)
========================= */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function setupCanvas(){
  const dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
  // 16:9 고정 레터박스. 모바일에서 크게 보이게.
  const maxW = window.innerWidth;
  const maxH = window.innerHeight;
  const targetAR = 16/9;
  let cssW = maxW;
  let cssH = cssW / targetAR;
  if (cssH > maxH){
    cssH = maxH;
    cssW = cssH * targetAR;
  }
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0); // draw in CSS pixels
}
addEventListener("resize", setupCanvas);
setupCanvas();

/* =========================
   1) 라벨 / 텍스트
========================= */
const KR_EL = { water:"물", fire:"불", electric:"전기", wind:"바람", light:"빛", dark:"암흑" };
const KR_UPG = { atk:"공격력 증가", hp:"최대 HP 증가", as:"공격속도 증가", ms:"이동속도 증가", mag:"자석 범위 증가" };

const GEAR = {
  saw:   { name:"톱날 드론", desc:"주변 회전 드론(누적 강화)" },
  shield:{ name:"보호막", desc:"피격 1회 무시(충전형)" },
  blackhole:{ name:"블랙홀", desc:"주기적 흡인 필드(누적 강화)" },
  bombs: { name:"연쇄 폭탄", desc:"처치 폭발 확률(누적 강화)" },
  clone: { name:"분신", desc:"보조 공격(누적 강화)" },
  thorns:{ name:"가시 오라", desc:"근접 도트(누적 강화)" },
};

function labelChoice(key){
  if (key.startsWith("el:")) return `속성: ${KR_EL[key.split(":")[1]] ?? key}`;
  if (key.startsWith("gear:")) return `장비: ${(GEAR[key.split(":")[1]]?.name) ?? key}`;
  return KR_UPG[key] ?? key;
}

const toast = document.getElementById("toast");
function showToast(msg, seconds=1.6){
  toast.textContent = msg;
  toast.style.opacity = "1";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.style.opacity="0", seconds*1000);
}

/* =========================
   2) 유틸
========================= */
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy;};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx, ay-by);
const norm=(dx,dy)=>{const d=Math.hypot(dx,dy)||1; return {x:dx/d,y:dy/d,d};};

function drawTriangle(x,y,r){
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.lineTo(x - r*0.9, y + r*0.8);
  ctx.lineTo(x + r*0.9, y + r*0.8);
  ctx.closePath();
}
function drawStar(x,y,r,inner=0.48, points=5){
  const step = Math.PI / points;
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const rr = (i%2===0) ? r : r*inner;
    const a = -Math.PI/2 + i*step;
    const px = x + Math.cos(a)*rr;
    const py = y + Math.sin(a)*rr;
    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

/* =========================
   3) 입력: PC 키 + 모바일 조이스틱
========================= */
const keys = new Set();
addEventListener("keydown", e => keys.add(e.key.toLowerCase()));
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));

const joyWrap = document.getElementById("joyWrap");
const joyKnob = document.getElementById("joyKnob");
const mobileHint = document.getElementById("mobileHint");

let isTouchDevice = ("ontouchstart" in window) || (navigator.maxTouchPoints>0);
if (isTouchDevice){
  joyWrap.style.display = "block";
  mobileHint.style.display = "block";
}

const joy = {
  active:false,
  id:null,
  cx:0, cy:0,
  dx:0, dy:0, // -1..1
  max:44, // knob radius range
};

function setKnob(dx,dy){
  const mx = dx*joy.max;
  const my = dy*joy.max;
  joyKnob.style.transform = `translate(${mx}px, ${my}px)`;
}

function handleJoyMove(clientX, clientY){
  const rect = joyWrap.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = (clientX - cx);
  let dy = (clientY - cy);
  const d = Math.hypot(dx,dy) || 1;
  const max = joy.max;
  const k = Math.min(1, d/max);
  dx = (dx/d)*k;
  dy = (dy/d)*k;
  joy.dx = dx; joy.dy = dy;
  setKnob(dx,dy);
}

function joyReset(){
  joy.active=false; joy.id=null; joy.dx=0; joy.dy=0;
  setKnob(0,0);
}

joyWrap.addEventListener("pointerdown", (e)=>{
  if (e.pointerType==="mouse") return; // 마우스는 키보드로
  joy.active=true; joy.id=e.pointerId;
  joyWrap.setPointerCapture(e.pointerId);
  handleJoyMove(e.clientX, e.clientY);
});
joyWrap.addEventListener("pointermove", (e)=>{
  if (!joy.active || e.pointerId!==joy.id) return;
  handleJoyMove(e.clientX, e.clientY);
});
joyWrap.addEventListener("pointerup", (e)=>{
  if (e.pointerId!==joy.id) return;
  joyReset();
});
joyWrap.addEventListener("pointercancel", (e)=>{
  if (e.pointerId!==joy.id) return;
  joyReset();
});

/* =========================
   4) 상태 / 엔티티
========================= */
const W = () => parseFloat(canvas.style.width) || (canvas.width/(window.devicePixelRatio||1));
const H = () => parseFloat(canvas.style.height) || (canvas.height/(window.devicePixelRatio||1));

const state = {
  running:false,
  paused:false,

  nickname:"Player",
  character:"ranged", // ranged | ninja

  time:300,
  elapsed:0,
  stage:1,
  stageMod:null,

  kills:0,

  level:1,
  xp:0,
  xpNeed:10,

  atk:12,
  maxHp:100,
  hp:100,
  as:3.0,
  ms:230,

  pickupRadius: 170,
  pickupForce: 1200,

  hurtFlash: 0,
  iframes: 0.5,
  ifrT: 0,
  freezeT: 0,

  pendingEl: null,
  synergyStacks: new Map(), // k -> lv
  gearLv: new Map(),        // id -> lv

  elementChanceBase: 0.56,
  elementChanceIfPending: 0.86,

  lvCursor: 0,

  // ninja tuning
  ninjaBladeAngle: 0,
  shieldCharges: 0,
  shieldRegenT: 0,
  _bhCd: 0,
  _healCd: 0,
};

const player = { x:0, y:0, r:12 };

const enemies = [];
const bullets = [];
const xpOrbs = [];
const items = [];
const fields = [];
const summons = [];

/* =========================
   5) 스테이지/엘리트
========================= */
const ELITE_POOL = [
  { id:"charger",  name:"돌진자",  misc:()=>({dashCd:2.2,dashT:0,dashing:false}) },
  { id:"splitter", name:"분열자",  misc:()=>({}) },
  { id:"summoner", name:"소환사",  misc:()=>({summonCd:3.2}) },
  { id:"bomber",   name:"폭발자",  misc:()=>({fuse:0}) },
  { id:"waver",    name:"파동자",  misc:()=>({waveCd:2.6}) },

  { id:"sniper",   name:"저격수",  misc:()=>({shotCd:1.8}) },
  { id:"shielder", name:"실더",    misc:()=>({shield:120}) },
  { id:"teleport", name:"텔레포터", misc:()=>({tpCd:3.0}) },
  { id:"vortex",   name:"소용돌이술사", misc:()=>({fieldCd:3.0}) },
  { id:"leaker",   name:"장판술사", misc:()=>({puddleCd:2.4}) },
];

let stageEliteSet = [];

function pickStageElites(){
  const copy = ELITE_POOL.slice();
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  stageEliteSet = copy.slice(0,4);
}

function rollStageModifier(){
  const mods = [
    { id:"xp",   name:"경험치 풍년" },
    { id:"slow", name:"한랭 기류" },
    { id:"rage", name:"광폭화" },
    { id:"heal", name:"치유의 기운" },
    { id:"gear", name:"장비 상점" },
  ];
  const m = mods[Math.floor(Math.random()*mods.length)];
  state.stageMod = m.id;
  showToast(`스테이지 효과: ${m.name}`, 1.6);
}

function spawnStageElite(){
  const pick = stageEliteSet[Math.floor(Math.random()*stageEliteSet.length)];
  const side = Math.floor(rand(0,4));
  const w=W(), h=H();
  let x,y;
  if(side===0){x=-30; y=rand(40,h-40);}
  if(side===1){x=w+30; y=rand(40,h-40);}
  if(side===2){x=rand(40,w-40); y=-30;}
  if(side===3){x=rand(40,w-40); y=h+30;}

  spawnEnemyNear(x,y,{ elite:true, type:pick.id, misc:pick.misc() });
  showToast(`정예 등장: ${pick.name}`, 1.4);
}

/* =========================
   6) 시너지/장비
========================= */
function keyPair(a,b){ return [a,b].sort().join("_"); }
function synergyName(k){
  const [a,b]=k.split("_");
  if (a===b) return `${KR_EL[a]} + ${KR_EL[b]} (진화)`;
  return `${KR_EL[a]} + ${KR_EL[b]}`;
}
function addSynergy(a,b){
  const k = keyPair(a,b);
  state.synergyStacks.set(k, (state.synergyStacks.get(k) ?? 0) + 1);
  showToast(`시너지 획득: ${synergyName(k)} (Lv.${state.synergyStacks.get(k)})`, 1.5);
}
function pickElement(el){
  if (!state.pendingEl){
    state.pendingEl = el;
    showToast(`대기 원소: ${KR_EL[el]}`, 1.0);
    return;
  }
  const a = state.pendingEl;
  const b = el;
  state.pendingEl = null;
  addSynergy(a,b);
}
function gearLevel(id){ return state.gearLv.get(id) ?? 0; }
function addGear(id){
  state.gearLv.set(id, gearLevel(id)+1);
  showToast(`장비 강화: ${GEAR[id].name} (Lv.${gearLevel(id)})`, 1.5);
  if (id==="shield"){
    state.shieldCharges = Math.min(3, state.shieldCharges + 1);
  }
}

/* =========================
   7) 레벨업 UI
========================= */
const levelupEl = document.getElementById("levelup");
const choicesEl = document.getElementById("choices");
const levelHint = document.getElementById("levelHint");

function summarizeSynergies(){
  const arr=[];
  for (const [k,lv] of state.synergyStacks.entries()) if(lv>0) arr.push(`${synergyName(k)}x${lv}`);
  return arr.length ? arr.slice(0,3).join(" / ") + (arr.length>3?" / …":"") : "-";
}
function summarizeGears(){
  const arr=[];
  for (const [k,lv] of state.gearLv.entries()) if(lv>0) arr.push(`${GEAR[k].name}x${lv}`);
  return arr.length ? arr.slice(0,3).join(" / ") + (arr.length>3?" / …":"") : "-";
}

function openLevelUp(){
  state.paused = true;
  levelupEl.style.display = "flex";
  choicesEl.innerHTML = "";

  const pool = ["atk","hp","as","ms","mag"];

  // 장비 등장 확률: 중반 이후 증가, gear 모드면 크게 증가
  const t = state.elapsed/300;
  const gearChance = (state.stageMod==="gear") ? 0.78 : (t<0.35 ? 0.32 : 0.55);
  if (Math.random() < gearChance){
    const gearIds = Object.keys(GEAR);
    pool.push("gear:"+gearIds[Math.floor(Math.random()*gearIds.length)]);
    if (Math.random() < 0.32){
      pool.push("gear:"+gearIds[Math.floor(Math.random()*gearIds.length)]);
    }
  }

  // 원소: 더 잘 뜨게(요청)
  const elChance = state.pendingEl ? state.elementChanceIfPending : state.elementChanceBase;
  if (Math.random() < elChance){
    const els = ["water","fire","electric","wind","light","dark"];
    let chosen;
    if (state.pendingEl && Math.random() < 0.30){
      chosen = state.pendingEl; // 모노 시너지 가능
    } else if (state.pendingEl && Math.random() < 0.55){
      const others = els.filter(e=>e!==state.pendingEl);
      chosen = others[Math.floor(Math.random()*others.length)];
    } else {
      chosen = els[Math.floor(Math.random()*els.length)];
    }
    pool.push("el:"+chosen);
  }

  // 3개 뽑기(원소는 최대 1개)
  const tmp = pool.slice();
  const picks=[];
  while (picks.length<3 && tmp.length){
    const idx = Math.floor(Math.random()*tmp.length);
    const v = tmp.splice(idx,1)[0];
    if (v.startsWith("el:") && picks.some(x=>x.startsWith("el:"))) continue;
    picks.push(v);
  }

  for (const p of picks){
    const btn = document.createElement("button");
    btn.textContent = labelChoice(p);
    btn.onclick = () => pickUpgrade(p);
    choicesEl.appendChild(btn);
  }

  state.lvCursor = 0;
  highlightChoice();

  const pending = state.pendingEl ? `대기 원소: ${KR_EL[state.pendingEl]}` : `대기 원소: -`;
  levelHint.textContent = `${pending} · 시너지: ${summarizeSynergies()} · 장비: ${summarizeGears()}`;
}

function highlightChoice(){
  [...choicesEl.children].forEach((b,i)=>{
    b.style.border = (i===state.lvCursor) ? "2px solid #ffd400" : "1px solid #444";
  });
}

addEventListener("keydown", (e)=>{
  if (!state.paused || levelupEl.style.display!=="flex") return;
  const k = e.key.toLowerCase();

  if (k==="arrowup" || k==="w"){
    state.lvCursor = (state.lvCursor + 2) % 3;
    highlightChoice();
    e.preventDefault();
  }
  if (k==="arrowdown" || k==="s"){
    state.lvCursor = (state.lvCursor + 1) % 3;
    highlightChoice();
    e.preventDefault();
  }
  if (k===" "){
    const btn = choicesEl.children[state.lvCursor];
    if (btn) btn.click();
    e.preventDefault();
  }
});

function pickUpgrade(p){
  if (p==="atk") state.atk += 2;
  if (p==="hp"){ state.maxHp += 18; state.hp = Math.min(state.maxHp, state.hp + 18); }
  if (p==="as") state.as += 0.28;
  if (p==="ms") state.ms += 18;
  if (p==="mag") state.pickupRadius = Math.min(360, state.pickupRadius + 28);

  if (p.startsWith("el:")) pickElement(p.split(":")[1]);
  if (p.startsWith("gear:")) addGear(p.split(":")[1]);

  levelupEl.style.display = "none";
  state.paused = false;
}

/* =========================
   8) XP / 레벨
========================= */
function gainXp(v){
  if (state.stageMod === "xp") v = Math.floor(v*1.25);
  state.xp += v;
  if (state.xp >= state.xpNeed){
    state.xp -= state.xpNeed;
    state.xpNeed = Math.floor(state.xpNeed * 1.35);
    state.level++;
    openLevelUp();
  }
}

/* =========================
   9) 스폰 / 드랍
========================= */
function spawnXp(x,y){ xpOrbs.push({x,y,r:5,vx:0,vy:0}); }
function spawnItem(x,y,type){ items.push({x,y,r:9,vx:0,vy:0,type}); }

function tryDropSupportItem(x,y){
  const t = state.elapsed / 300;
  const base = 0.008 + t*0.012; // 약간 줄인 드랍(요청)
  if (Math.random() > base) return;
  const r = Math.random();
  if (r < 0.58) spawnItem(x,y,"heal");
  else if (r < 0.84) spawnItem(x,y,"freeze");
  else spawnItem(x,y,"nuke");
}

function spawnEnemyNear(x,y, opts={}){
  const kind = opts.kind ?? "normal";
  const elite = !!opts.elite;

  const t = state.elapsed/300;
  const r = Math.random();
  let behavior="normal";
  if (t < 0.55){
    behavior = (r<0.72)?"normal":(r<0.90)?"strafe":"swarm";
  } else {
    behavior = (r<0.42)?"normal":(r<0.70)?"strafe":(r<0.88)?"swarm":"orbit";
  }

  const baseHp = 12 + state.level*1.5;
  const baseSpd = 70 + state.level*4;

  const e = {
    x:x+rand(-16,16), y:y+rand(-16,16),
    r: elite ? 18 : (kind==="mini"?9:12),
    hp: elite ? (210 + state.level*16) : (kind==="mini" ? (6 + state.level*0.8) : baseHp),
    spd: elite ? (88 + state.level*3) : (kind==="mini"? (95 + state.level*4) : baseSpd),
    elite,
    type: opts.type ?? "normal",
    behavior,

    burnT:0, burnDps:0,
    slowT:0,
    fearT:0,

    phase: rand(0,Math.PI*2),
    preferR: 140 + rand(-30, 70),
    jukeT: rand(0.6, 1.6),
    jukeDir: Math.random()<0.5?-1:1,

    misc: Object.assign({}, opts.misc ?? {}),
  };

  enemies.push(e);
}

function spawnEnemy(){

  if(side===0){x=-20; y=rand(0,h);}
  if(side===1){x=w+20; y=rand(0,h);}

/* =========================
   10) 플레이어 피해 처리
========================= */
state.hurtPlayer = function(amount){
  if (state.shieldCharges > 0){
    state.shieldCharges--;
    state.hurtFlash = Math.max(state.hurtFlash, 0.22);
    state.ifrT = Math.max(state.ifrT, 0.25);
    showToast("보호막!", 0.6);

  }
  state.hp -= amount;
  state.hurtFlash = Math.max(state.hurtFlash, 0.65);
  state.ifrT = state.iframes;
};

/* =========================
   11) 적 이동 패턴
========================= */
function computeEnemyVelocity(e, dt){
  const fear = (e.fearT > 0);
  const dx = player.x - e.x, dy = player.y - e.y;
  const v = norm(dx,dy);
  let vx=v.x, vy=v.y;

  if (e.behavior === "strafe"){
    e.jukeT -= dt;
    if (e.jukeT <= 0){ e.jukeT = rand(0.6, 1.6); e.jukeDir *= -1; }
    const pxn = -v.y, pyn = v.x;
    vx = v.x*0.78 + pxn*(0.55*e.jukeDir);
    vy = v.y*0.78 + pyn*(0.55*e.jukeDir);
    const n = norm(vx,vy); vx=n.x; vy=n.y;
  }

  if (e.behavior === "orbit"){
    const pxn = -v.y, pyn = v.x;
    const sign = (e.phase > Math.PI ? 1 : -1);
    const err = (v.d - e.preferR);
    const toward = clamp(err/140, -0.7, 0.7);
    vx = v.x*toward + pxn*(0.85*sign);
    vy = v.y*toward + pyn*(0.85*sign);
    const n = norm(vx,vy); vx=n.x; vy=n.y;
    e.phase += dt*0.9;
    if (e.phase > Math.PI*2) e.phase -= Math.PI*2;
  }

  if (e.behavior === "swarm"){
    const targetR = e.preferR;
    const err = v.d - targetR;
    const k = clamp(err/120, -1, 1);
    const pxn = -v.y, pyn = v.x;
    vx = v.x*k + pxn*0.35*Math.sin(e.phase);
    vy = v.y*k + pyn*0.35*Math.sin(e.phase);
    const n = norm(vx,vy); vx=n.x; vy=n.y;
    e.phase += dt*1.7;
    if (e.phase > Math.PI*2) e.phase -= Math.PI*2;
  }

  if (fear){ vx=-vx; vy=-vy; }
  return {vx,vy};
}

/* =========================
   12) 전기 체인 (기본 원소 전기)
========================= */
function chainLightning(firstEnemy, baseDamage, maxChains=3, range=140){
  const c=[];
  for(const e of enemies){
    if(e===firstEnemy) continue;
    const d=dist(firstEnemy.x,firstEnemy.y,e.x,e.y);
    if(d<=range) c.push({e,d});
  }
  c.sort((a,b)=>a.d-b.d);
  for(let i=0;i<Math.min(maxChains,c.length);i++){
    c[i].e.hp -= baseDamage;
  }
}

/* =========================
   13) 필드 생성 + 덕지덕지 방지(merge)
   - 같은 kind가 근처에 있으면 합치기
========================= */
function spawnField(kind, x, y, r, life, power, meta={}){
  // merge
  for (const f of fields){
    if (f.kind !== kind) continue;
    if (dist2(f.x,f.y,x,y) < 70*70){
      f.r = Math.min(f.r + r*0.22, r*1.55);
      f.life = Math.max(f.life, life);
      f.power = Math.max(f.power, power);
      // 위치는 평균으로 약간 보정
      f.x = (f.x*0.7 + x*0.3);
      f.y = (f.y*0.7 + y*0.3);
      return;
    }
  }
  fields.push({kind,x,y,r,life,power,meta});
}
function spawnSummon(kind, x, y, life, power, meta={}){
  summons.push({kind,x,y,life,cd:0,power,meta});
}

function applySynergyOnHit(enemy, tags){
  const els = [...tags].filter(t=>KR_EL[t]);
  if (els.length < 2) return;
  const k = keyPair(els[0], els[1]);
  const stack = state.synergyStacks.get(k) ?? 0;
  if (stack <= 0) return;

  switch(k){
    case "fire_water":      spawnField("smoke", enemy.x, enemy.y, 85 + 8*stack, 3.0 + 0.2*stack, 1, {}); break;
    case "electric_water":  spawnField("storm", enemy.x, enemy.y, 95 + 10*stack, 3.0, 8 + 2*stack, {}); break;
    case "water_wind":      spawnField("tornado", enemy.x, enemy.y, 60 + 6*stack, 1.6 + 0.1*stack, 14 + 2*stack, {vx: rand(-1,1), vy: rand(-1,1)}); break;
    case "light_water":     spawnSummon("plant", enemy.x, enemy.y, 8.0 + 0.7*stack, 1 + 0.25*stack, {}); break;
    case "dark_water":      spawnField("oil", enemy.x, enemy.y, 90 + 8*stack, 6.0, 1, {}); break;

    case "electric_fire":   spawnField("blast", enemy.x, enemy.y, 70 + 6*stack, 0.30, 22 + 3*stack, {}); break;
    case "fire_wind":       spawnField("firevortex", enemy.x, enemy.y, 85 + 8*stack, 2.2, 10 + 2*stack, {}); break;
    case "fire_light":      spawnField("flare", enemy.x, enemy.y, 90 + 6*stack, 1.2, 16 + 2*stack, {}); break;
    case "dark_fire":       enemy.misc.curseBoom = Math.max(enemy.misc.curseBoom ?? 0, 2 + stack); break;

    case "electric_wind":   spawnField("spark", enemy.x, enemy.y, 95 + 8*stack, 2.0, 1 + stack, {}); break;
    case "electric_light":  enemy.misc.prism = Math.max(enemy.misc.prism ?? 0, 2 + stack); break;
    case "dark_electric":   spawnField("darkbolt", enemy.x, enemy.y, 90, 0.55, 18 + 3*stack, {}); break;

    case "light_wind":      spawnSummon("shards", enemy.x, enemy.y, 4.0, 1 + 0.3*stack, {}); break;
    case "dark_wind":       enemy.fearT = Math.max(enemy.fearT, 0.6 + 0.12*stack); break;
    case "dark_light":      spawnField("eclipse", enemy.x, enemy.y, 110 + 10*stack, 2.0, 12 + 2*stack, {}); break;

    // 모노 시너지(같은 원소)
    case "water_water":     spawnField("frost", enemy.x, enemy.y, 80 + 8*stack, 1.2, 1, {}); break;
    case "fire_fire":       spawnField("ringfire", enemy.x, enemy.y, 85 + 6*stack, 1.0, 10 + 2*stack, {}); break;
    case "electric_electric": spawnField("lightning", enemy.x, enemy.y, 40, 0.25, 26 + 4*stack, {}); break;
    case "wind_wind":       spawnField("gust", enemy.x, enemy.y, 80, 0.6, 10 + 2*stack, {}); break;
    case "light_light":     state.shieldCharges = Math.min(3, state.shieldCharges + 1); break;
    case "dark_dark":       spawnSummon("shadow", enemy.x, enemy.y, 5.5, 1 + 0.25*stack, {}); break;
  }
}

function applySynergyOnShot(target){
  for (const [k,stack] of state.synergyStacks.entries()){
    if (stack <= 0) continue;

    if (k==="electric_electric" && Math.random() < (0.10 + 0.03*Math.min(6,stack)) && enemies.length){
      const e = enemies[Math.floor(Math.random()*enemies.length)];
      spawnField("lightning", e.x, e.y, 45, 0.25, 24 + 4*stack, {});
    }
    if (k==="light_light"){
      state.shieldRegenT -= 0.08;
      if (state.shieldRegenT <= 0){
        state.shieldRegenT = Math.max(0.9, 2.2 - 0.15*Math.min(6,stack));
        state.shieldCharges = Math.min(3, state.shieldCharges + 1);

      spawnField("oil", target.x, target.y, 75 + 6*stack, 5.0, 1, {});

}

/* =========================
   16) 필드/소환 틱
========================= */
function tickFields(dt){
  for (let i=fields.length-1;i>=0;i--){
    const f = fields[i];
    f.life -= dt;
    if (f.life <= 0){ fields.splice(i,1); continue; }

    if (f.kind==="smoke"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.slowT = Math.max(e.slowT, 0.3);
          e.misc.inSmoke = 0.2;
        }
      }
    }

    if (f.kind==="storm"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power * dt;
        }
      }
    }

    if (f.kind==="tornado"){
      const n = norm(f.meta.vx ?? 0, f.meta.vy ?? 0);
      const w=W(), h=H();
      f.x = clamp(f.x + n.x*260*dt, 10, w-10);
      f.y = clamp(f.y + n.y*260*dt, 10, h-10);
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power * dt;
        }
      }
    }

    if (f.kind==="oil"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.slowT = Math.max(e.slowT, 0.8);
          if (e.burnT > 0){
            e.burnDps = Math.max(e.burnDps, 16);
            e.burnT = Math.max(e.burnT, 2.5);
          }
        }
      }
    }

    if (f.kind==="blast"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power;
        }
      }
      f.life = 0;
    }

    if (f.kind==="firevortex" || f.kind==="flare"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power * dt;
          if (f.kind==="firevortex"){
            const v = norm(e.x-f.x, e.y-f.y);
            e.x += v.x*10*dt; e.y += v.y*10*dt;
          }
        }
      }
    }

    if (f.kind==="spark"){
      if (Math.random() < 0.20*dt*f.power && enemies.length){
        const e = enemies[Math.floor(Math.random()*enemies.length)];
        e.hp -= 14 + 2*Math.min(6,f.power);
      }
    }

    if (f.kind==="darkbolt"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power;
        }
      }
      f.life = 0;
    }

    if (f.kind==="eclipse"){
      for (const e of enemies){
        const d2 = dist2(f.x,f.y,e.x,e.y);
        if (d2 < (f.r + e.r)**2){
          const v = norm(f.x - e.x, f.y - e.y);
          e.x += v.x*90*dt;
          e.y += v.y*90*dt;
          e.hp -= f.power*dt;
        }
      }
    }

    if (f.kind==="acid"){
      if (dist2(f.x,f.y,player.x,player.y) < (f.r + player.r)**2 && state.ifrT<=0){
        state.hurtPlayer(6);
      }
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power*dt;
        }
      }
    }

    if (f.kind==="wave"){
      // 피해는 eliteTick에서만
    }

    if (f.kind==="frost"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.slowT = Math.max(e.slowT, 1.0);
        }
      }
    }

    if (f.kind==="ringfire" || f.kind==="gust"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power*dt;
          if (f.kind==="gust") e.fearT = Math.max(e.fearT, 0.25);
        }
      }
    }

    if (f.kind==="lightning"){
      for (const e of enemies){
        if (dist2(f.x,f.y,e.x,e.y) < (f.r + e.r)**2){
          e.hp -= f.power;
        }
      }
      f.life = 0;
    }
  }
}

function tickSummons(dt){
  for (let i=summons.length-1;i>=0;i--){
    const s = summons[i];
    s.life -= dt;
    if (s.life <= 0){ summons.splice(i,1); continue; }

    s.cd -= dt;

    if (s.kind==="plant"){
      if (s.cd <= 0){
        s.cd = Math.max(0.55, 1.2 - 0.08*Math.min(6,s.power));
        if (enemies.length){
          let best=null, bd=1e9;
          for (const e of enemies){
            const d2 = dist2(s.x,s.y,e.x,e.y);
            if (d2 < bd){ bd=d2; best=e; }
          }
          if (best){
            const ang = Math.atan2(best.y - s.y, best.x - s.x);
            bullets.push({x:s.x,y:s.y,vx:Math.cos(ang)*520,vy:Math.sin(ang)*520,r:5,dmg:state.atk*(0.40+0.07*s.power),tags:new Set(["plantshot"]),pierce:0,hitSet:new Set(),life:2.0});
          }
        }
      }
    }

    if (s.kind==="shards"){
      if (s.cd <= 0){
        s.cd = 0.35;
        if (enemies.length){
          const e = enemies[Math.floor(Math.random()*enemies.length)];
          e.hp -= state.atk*(0.20 + 0.05*Math.min(6,s.power));
        }
      }
    }

    if (s.kind==="shadow"){
      if (s.cd <= 0){
        s.cd = 0.8;
        if (enemies.length){
          const e = enemies[Math.floor(Math.random()*enemies.length)];
          const ang = Math.atan2(e.y - s.y, e.x - s.x);
          bullets.push({x:s.x,y:s.y,vx:Math.cos(ang)*540,vy:Math.sin(ang)*540,r:4,dmg:state.atk*(0.30+0.05*s.power),tags:new Set(["shadowshot"]),pierce:0,hitSet:new Set(),life:2.0});
        }
      }
    }
  }
}

/* =========================
   17) 전투(원거리 / 닌자)
========================= */
function nearestEnemy(){
  if (!enemies.length) return null;
  let best=enemies[0], bestD=dist2(player.x,player.y,enemies[0].x,enemies[0].y);
  for (let i=1;i<enemies.length;i++){
    const d=dist2(player.x,player.y,enemies[i].x,enemies[i].y);
    if (d<bestD){ bestD=d; best=enemies[i]; }
  }
  return best;
}

function fireBulletTowards(target, dmg, speed, tags, pierce, radius=4, life=2.1){
  const ang = Math.atan2(target.y-player.y, target.x-player.x);
  bullets.push({
    x:player.x, y:player.y,
    vx:Math.cos(ang)*speed,
    vy:Math.sin(ang)*speed,
    r:radius,
    dmg,
    tags:new Set(tags),
    pierce,
    hitSet:new Set(),
    life,
  });
}

let shootCd = 0;
function shoot(dt){
  shootCd -= dt;
  if (shootCd > 0) return;
  shootCd = 1 / state.as;

  const t = nearestEnemy();
  if (!t) return;

  // 원거리만 기본탄
  if (state.character === "ranged"){
    fireBulletTowards(t, state.atk, 540, [], 0, 4);
  }

  // 대기 원소 추가탄
  if (state.pendingEl){
    fireBulletTowards(t, state.atk*0.62, 560, [state.pendingEl], 0, 4);
  }

  // 시너지탄: 큼 + 관통
  for (const [k,stack] of state.synergyStacks.entries()){
    const [a,b]=k.split("_");
    const dmg = state.atk * (0.68 + 0.07*Math.min(4,stack));
    fireBulletTowards(t, dmg, 520, [a,b], 2, 8, 2.0);
  }

  // 분신 장비: 보조탄
  const cl = gearLevel("clone");
  if (cl > 0 && Math.random() < 0.35){
    fireBulletTowards(t, state.atk*(0.32+0.06*Math.min(6,cl)), 560, [], 0, 4, 1.8);
  }

  applySynergyOnShot(t);
}

function ninjaMeleeTick(dt){
  if (state.character !== "ninja") return;

  // ✅ 닌자 밸런스(사기 방지):
  // - 링 판정 타격
  // - 적별 히트 쿨다운
  // - 동시에 맞는 적 수 제한(캡)
  // - 후반 스케일 완만
  const range = 52 + Math.min(44, state.level*1.2);
  state.ninjaBladeAngle += dt * (4.0 + state.as*0.42);

  const hitCd = 0.28; // 이전보다 느리게
  const base = 0.72 + 0.04*Math.min(10, state.level); // 완만 성장
  const hitDmg = state.atk * base;
  const hitThickness = 12;
  const maxTargets = 4 + Math.floor(Math.min(6, state.level/8)); // 동시타격 제한

  // 가까운 적부터 처리 (캡 적용)
  const cand = [];
  for (const e of enemies){
    const d = dist(player.x, player.y, e.x, e.y);
    if (Math.abs(d - range) <= (hitThickness + e.r)) cand.push({e,d});
  }
  cand.sort((a,b)=>a.d-b.d);

  let hitCount = 0;
  for (const {e} of cand){
    if (hitCount >= maxTargets) break;

    e.misc.ninjaHitT = Math.max(0, (e.misc.ninjaHitT ?? 0) - dt);
    if (e.misc.ninjaHitT > 0) continue;

    e.misc.ninjaHitT = hitCd;
    e.hp -= hitDmg;
    hitCount++;

    // 약한 넉백(타격감)
    const v = norm(e.x - player.x, e.y - player.y);
    e.x += v.x * 14;
    e.y += v.y * 14;
  }
}

/* =========================
   18) 피격 처리(원소/시너지)
========================= */
function onHit(enemy, bullet){
  enemy.hp -= bullet.dmg;
  const tags = bullet.tags;

  // 단일 원소 효과
  if (tags.has("water")) enemy.slowT = Math.max(enemy.slowT, 1.5);
  if (tags.has("fire")){
    enemy.burnT = Math.max(enemy.burnT, 2.0);
    enemy.burnDps = Math.max(enemy.burnDps, 10);
  }
  if (tags.has("electric")) chainLightning(enemy, 9, 3, 140);
  if (tags.has("wind")){
    const v = norm(enemy.x-player.x, enemy.y-player.y);
    enemy.x += v.x*14; enemy.y += v.y*14;
  }
  if (tags.has("dark")) enemy.fearT = Math.max(enemy.fearT, 1.0);

  applySynergyOnHit(enemy, tags);
}

/* =========================
   19) 엘리트 패턴
========================= */
function eliteTick(e, dt){
  if (state.freezeT > 0) return;
  const toP = norm(player.x - e.x, player.y - e.y);

  switch(e.type){
    case "charger":
      e.misc.dashCd -= dt;
      if (e.misc.dashCd <= 0){ e.misc.dashCd = 2.2; e.misc.dashT = 0.45; }
      if (e.misc.dashT > 0){ e.misc.dashT -= dt; e.misc.dashing = true; }
      else e.misc.dashing = false;
      break;

    case "summoner":
      e.misc.summonCd -= dt;
      if (e.misc.summonCd <= 0){
        e.misc.summonCd = 3.2;
        spawnEnemyNear(e.x,e.y);
        spawnEnemyNear(e.x,e.y);
        showToast("소환!", 0.7);
      }
      break;

    case "bomber":
      if (dist2(e.x,e.y,player.x,player.y) < 95*95){
        e.misc.fuse += dt;
        if (e.misc.fuse > 1.2){
          if (state.ifrT <= 0) state.hurtPlayer(32);
          e.hp = 0;
          showToast("자폭!", 0.7);
        }
      } else {
        e.misc.fuse = Math.max(0, e.misc.fuse - dt*0.6);
      }
      break;

    case "waver":
      e.misc.waveCd -= dt;
      if (e.misc.waveCd <= 0){
        e.misc.waveCd = 2.6;
        spawnField("wave", e.x, e.y, 220, 0.35, 14, {});
        if (dist2(e.x,e.y,player.x,player.y) < 220*220 && state.ifrT<=0) state.hurtPlayer(14);
        showToast("충격파!", 0.6);
      }
      break;

    case "sniper":
      e.misc.shotCd -= dt;
      if (e.misc.shotCd <= 0){
        e.misc.shotCd = 1.8;
        const sp = 360;
        bullets.push({
          x:e.x, y:e.y,
          vx:toP.x*sp, vy:toP.y*sp,
          r:5, dmg:14, tags:new Set(["enemyshot"]),
          pierce:0, hitSet:new Set(), life:3.0
        });
      }
      break;

    case "teleport":
      e.misc.tpCd -= dt;
      if (e.misc.tpCd <= 0){
        e.misc.tpCd = 3.0;
        const ang = rand(0,Math.PI*2);
        const rr = rand(130, 220);
        const w=W(), h=H();
        e.x = clamp(player.x + Math.cos(ang)*rr, 20, w-20);
        e.y = clamp(player.y + Math.sin(ang)*rr, 20, h-20);
        showToast("텔레포트!", 0.6);
      }
      break;

    case "vortex":
      e.misc.fieldCd -= dt;
      if (e.misc.fieldCd <= 0){
        e.misc.fieldCd = 3.0;
        spawnField("eclipse", e.x, e.y, 115, 1.6, 9, {});
      }
      break;

    case "leaker":
      e.misc.puddleCd -= dt;
      if (e.misc.puddleCd <= 0){
        e.misc.puddleCd = 2.4;
        spawnField("acid", e.x, e.y, 95, 3.2, 8, {});
      }
      break;
  }
}

/* =========================
   20) 업데이트
========================= */
function update(dt){
  if (!state.running || state.paused) return;

  state.elapsed += dt;
  state.time -= dt;

  const newStage = clamp(Math.floor(state.elapsed/60)+1, 1, 5);
  if (newStage !== state.stage){
    state.stage = newStage;
    pickStageElites();
    rollStageModifier();
    spawnStageElite();
  }

  if (state.time <= 0){
    state.time = 0;
    endGame(false);
    return;
  }

  // 후반: 엘리트 추가 등장(가끔)
  if (state.elapsed > 60 && Math.random() < (0.0011 + 0.00035*(state.stage-1))){
    spawnStageElite();
  }

  // 모디파이어 heal
  if (state.stageMod === "heal"){
    state._healCd -= dt;
    if (state._healCd <= 0){
      state._healCd = 4.0;
      state.hp = Math.min(state.maxHp, state.hp + 6);
    }
  }

  state.hurtFlash = Math.max(0, state.hurtFlash - dt*3.2);
  state.ifrT = Math.max(0, state.ifrT - dt);
  if (state.freezeT > 0) state.freezeT -= dt;

  // 이동 입력: 키보드 + 조이스틱 합산
  let mx=(keys.has("a")||keys.has("arrowleft")?-1:0)+(keys.has("d")||keys.has("arrowright")?1:0);
  let my=(keys.has("w")||keys.has("arrowup")?-1:0)+(keys.has("s")||keys.has("arrowdown")?1:0);

  // 모바일 조이스틱 반영
  if (isTouchDevice){
    mx += joy.dx;
    my += joy.dy;
  }

  const mlen=Math.hypot(mx,my);
  if (mlen > 0.001){
    mx/=mlen; my/=mlen;
    player.x += mx*state.ms*dt;
    player.y += my*state.ms*dt;
  }
  const w=W(), h=H();
  player.x=clamp(player.x,10,w-10);
  player.y=clamp(player.y,10,h-10);

  // 스폰 난이도
  const t = state.elapsed/300;
  let spawnP = clamp(0.028 + t*0.016 + state.level*0.0011, 0, 0.050);
  if (state.stageMod === "rage") spawnP *= 1.08;
  if (Math.random() < spawnP) spawnEnemy();

  // 전투
  ninjaMeleeTick(dt);
  shoot(dt);

  // 적 업데이트
  for (const e of enemies){
    if (e.burnT > 0){ e.hp -= e.burnDps*dt; e.burnT -= dt; }
    if (e.slowT > 0) e.slowT -= dt;
    if (e.fearT > 0) e.fearT -= dt;
    if (e.misc.inSmoke > 0) e.misc.inSmoke -= dt;

    if (state.freezeT > 0) continue;

    if (e.elite) eliteTick(e, dt);

    const {vx,vy} = computeEnemyVelocity(e, dt);
    let spd = e.spd;
    if (e.slowT > 0) spd *= 0.45;
    if (state.stageMod === "slow") spd *= 0.92;
    if (e.elite && e.type==="charger" && e.misc.dashing) spd *= 3.1;

    e.x += vx*spd*dt;
    e.y += vy*spd*dt;

    // 접촉 피해 (연막 안에서는 약하게)
    if (dist2(e.x,e.y,player.x,player.y) < (e.r + player.r)**2){
      if (state.ifrT <= 0){
        const dmg = (e.misc.inSmoke > 0) ? 6 : 18;
        state.hurtPlayer(dmg);
      }
    }
  }

  // 탄환 업데이트/충돌
  for (let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.life -= dt;
    if (b.life <= 0){ bullets.splice(i,1); continue; }

    b.x += b.vx*dt; b.y += b.vy*dt;
    if (b.x < -60 || b.x > w+60 || b.y < -60 || b.y > h+60){ bullets.splice(i,1); continue; }

    if (b.tags.has("enemyshot")){
      if (dist2(b.x,b.y,player.x,player.y) < (b.r + player.r)**2){
        if (state.ifrT <= 0) state.hurtPlayer(b.dmg);
        bullets.splice(i,1);
      }
      continue;
    }

    for (let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if (dist2(b.x,b.y,e.x,e.y) < (b.r + e.r)**2){
        if (b.hitSet.has(e)) continue;
        b.hitSet.add(e);

        if (e.elite && e.type==="shielder"){
          e.misc.shield = e.misc.shield ?? 120;
          const take = Math.min(e.misc.shield, b.dmg);
          e.misc.shield -= take;
          const rest = b.dmg - take;
          if (rest > 0) onHit(e, {dmg:rest, tags:b.tags});
          else applySynergyOnHit(e, b.tags);
        } else {
          onHit(e,b);
        }

        if (e.misc.prism > 0){
          e.misc.prism -= 1;
          const t = nearestEnemy();
          if (t){
            fireBulletTowards(t, state.atk*0.32, 560, [], 0, 4, 1.5);
            fireBulletTowards(t, state.atk*0.32, 560, [], 0, 4, 1.5);
          }
        }

        if (b.pierce > 0) b.pierce--;
        else bullets.splice(i,1);
        break;
      }
    }
  }

  // 필드/소환/장비
  tickFields(dt);
  tickSummons(dt);
  tickGear(dt);

  // 사망 처리
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if (e.hp <= 0){
      if (e.misc.curseBoom){
        spawnField("blast", e.x, e.y, 85, 0.25, 16 + 4*e.misc.curseBoom, {});
      }
      if (e.elite && e.type==="splitter"){
        for(let k=0;k<4;k++) spawnEnemyNear(e.x,e.y,{kind:"mini"});
      }

      spawnXp(e.x,e.y);

      const blv = gearLevel("bombs");
      if (blv > 0 && Math.random() < (0.10 + 0.02*Math.min(10,blv))){
        spawnField("blast", e.x, e.y, 75 + 4*blv, 0.25, 18 + 2*blv, {});
      }

      tryDropSupportItem(e.x,e.y);
      enemies.splice(i,1);
      state.kills++;
    }
  }

  // XP 자석
  for (let i=xpOrbs.length-1;i>=0;i--){
    const o = xpOrbs[i];
    const dx = player.x - o.x, dy = player.y - o.y;
    const d2 = dx*dx + dy*dy;
    const R = state.pickupRadius;
    if (d2 < R*R){
      const d = Math.sqrt(d2) || 0.0001;
      const nx = dx/d, ny = dy/d;
      const pull = state.pickupForce * (1 - d/R);
      o.vx += nx*pull*dt; o.vy += ny*pull*dt;
      const v = Math.hypot(o.vx,o.vy), vmax=900;
      if (v>vmax){ o.vx=o.vx/v*vmax; o.vy=o.vy/v*vmax; }
    }
    o.x += o.vx*dt; o.y += o.vy*dt;
    o.vx *= Math.pow(0.001, dt); o.vy *= Math.pow(0.001, dt);

    if (d2 < 26*26){
      gainXp(10);
      xpOrbs.splice(i,1);
    }
  }

  // 아이템 자석/획득
  for (let i=items.length-1;i>=0;i--){
    const it = items[i];
    const dx = player.x - it.x, dy = player.y - it.y;
    const d2 = dx*dx + dy*dy;
    const R = Math.max(120, state.pickupRadius*0.85);
    if (d2 < R*R){
      const d = Math.sqrt(d2) || 0.0001;
      const nx = dx/d, ny = dy/d;
      const pull = 900*(1-d/R);
      it.vx += nx*pull*dt; it.vy += ny*pull*dt;
      const v = Math.hypot(it.vx,it.vy), vmax=820;
      if (v>vmax){ it.vx=it.vx/v*vmax; it.vy=it.vy/v*vmax; }
    }
    it.x += it.vx*dt; it.y += it.vy*dt;
    it.vx *= Math.pow(0.001, dt); it.vy *= Math.pow(0.001, dt);

    if (d2 < 30*30){
      if (it.type==="heal"){
        const heal = Math.floor(state.maxHp*0.35);
        state.hp = Math.min(state.maxHp, state.hp + heal);
        showToast(`회복 +${heal}`, 1.1);
      }
      if (it.type==="freeze"){
        state.freezeT = 3.0;
        showToast("빙결!", 1.1);
      }
      if (it.type==="nuke"){
        const n = enemies.length;
        state.kills += n;
        enemies.length = 0;
        showToast(`폭탄! ${n}마리 제거`, 1.1);
      }
      items.splice(i,1);
    }
  }

  if (state.hp <= 0){
    state.hp = 0;
    endGame(true);
  }
}

/* =========================
   21) 렌더: “장판 규칙” + “원소별 최소 미니멀 구분”
   - 핵심: 장판은 대부분 stroke 중심
   - XP는 항상 마지막에 렌더(최상단)
========================= */

// 필드 kind별 스타일(테두리/채움/이중원/점선/스파크)
const FIELD_STYLE = {
  // 물 계열
  smoke:   { mode:"dotted", stroke:"#ffffff", alpha:0.35, lw:2 },
  storm:   { mode:"double", stroke:"#66ccff", alpha:0.35, lw:2 },
  frost:   { mode:"stroke", stroke:"#66ccff", alpha:0.30, lw:2 },
  oil:     { mode:"fill",   fill:"#222222", alpha:0.20, lw:0 },

  // 불 계열
  flare:     { mode:"stroke", stroke:"#ff8844", alpha:0.35, lw:2 },
  firevortex: { mode:"double", stroke:"#ff8844", alpha:0.35, lw:2 },
  ringfire:   { mode:"stroke", stroke:"#ff8844", alpha:0.30, lw:2 },
  blast:      { mode:"fill", fill:"#ffd400", alpha:0.22, lw:0 }, // 즉발

  // 전기 계열
  spark:     { mode:"spark", stroke:"#ffd400", alpha:0.40, lw:2 },
  lightning: { mode:"fill", fill:"#ffd400", alpha:0.20, lw:0 }, // 즉발
  darkbolt:  { mode:"fill", fill:"#b388ff", alpha:0.18, lw:0 }, // 즉발(암전 낙뢰)

  // 바람 계열
  tornado: { mode:"double", stroke:"#88ffff", alpha:0.30, lw:2 },
  gust:    { mode:"dotted", stroke:"#88ffff", alpha:0.30, lw:2 },

  // 빛/암흑
  eclipse: { mode:"stroke", stroke:"#b388ff", alpha:0.28, lw:3 },
  acid:    { mode:"stroke", stroke:"#66ff66", alpha:0.28, lw:2 },
  wave:    { mode:"stroke", stroke:"#66ccff", alpha:0.25, lw:2 },
};

function drawCircleStroke(x,y,r,style){
  ctx.save();
  ctx.globalAlpha = style.alpha ?? 0.35;
  ctx.lineWidth = style.lw ?? 2;
  ctx.strokeStyle = style.stroke ?? "#fff";
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function drawCircleFill(x,y,r,style){
  ctx.save();
  ctx.globalAlpha = style.alpha ?? 0.25;
  ctx.fillStyle = style.fill ?? "#fff";
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawCircleDouble(x,y,r,style){
  drawCircleStroke(x,y,r,style);
  drawCircleStroke(x,y,Math.max(0,r-10),style);
}
function drawCircleDotted(x,y,r,style){
  ctx.save();
  ctx.globalAlpha = style.alpha ?? 0.35;
  ctx.lineWidth = style.lw ?? 2;
  ctx.strokeStyle = style.stroke ?? "#fff";
  ctx.setLineDash([6,6]);
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}
function drawSparkDots(x,y,r,style){
  // 테두리 + 내부 점 몇 개(전기 느낌)
  drawCircleStroke(x,y,r,style);
  ctx.save();
  ctx.globalAlpha = (style.alpha ?? 0.4) * 0.9;
  ctx.fillStyle = style.stroke ?? "#ffd400";
  for(let i=0;i<4;i++){
    const a = rand(0,Math.PI*2);
    const rr = rand(0,r*0.75);
    ctx.beginPath();
    ctx.arc(x + Math.cos(a)*rr, y + Math.sin(a)*rr, 2.2, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawField(f){
  const style = FIELD_STYLE[f.kind] ?? {mode:"stroke", stroke:"#fff", alpha:0.25, lw:2};
  if (style.mode==="fill") return drawCircleFill(f.x,f.y,f.r,style);
  if (style.mode==="double") return drawCircleDouble(f.x,f.y,f.r,style);
  if (style.mode==="dotted") return drawCircleDotted(f.x,f.y,f.r,style);
  if (style.mode==="spark") return drawSparkDots(f.x,f.y,f.r,style);
  return drawCircleStroke(f.x,f.y,f.r,style);
}

function draw(){
  const w=W(), h=H();
  ctx.clearRect(0,0,w,h);

  // 1) 필드(장판) 먼저 (대부분 stroke라 덜 덕지덕지)
  for (const f of fields) drawField(f);

  // 2) 아이템
  for (const it of items){
    ctx.beginPath(); ctx.arc(it.x,it.y,it.r,0,Math.PI*2);
    if (it.type==="heal") ctx.fillStyle="#4cff4c";
    if (it.type==="freeze") ctx.fillStyle="#4cc9ff";
    if (it.type==="nuke") ctx.fillStyle="#ff4c4c";
    ctx.fill();
  }

  // 3) 소환물(미니멀 점)
  for (const s of summons){
    ctx.beginPath(); ctx.arc(s.x,s.y,6,0,Math.PI*2);
    ctx.fillStyle = (s.kind==="plant")?"#88ff88":(s.kind==="shadow")?"#b388ff":"#ffd400";
    ctx.fill();
  }

  // 4) 적: 일반=세모, 엘리트=별
  for (const e of enemies){
    if (e.elite){
      drawStar(e.x, e.y, e.r);
      let col = "#ffcc66";
      if (e.type==="bomber") col="#ff6666";
      if (e.type==="sniper") col="#66ccff";
      if (e.type==="teleport") col="#cc66ff";
      if (e.type==="shielder") col="#66ffcc";
      ctx.fillStyle = col;
      ctx.fill();

      if (e.type==="shielder"){
        const sh = e.misc.shield ?? 0;
        if (sh > 0){
          ctx.beginPath();
          ctx.arc(e.x,e.y,e.r+6,0,Math.PI*2);
          ctx.strokeStyle="rgba(100,255,220,.75)";
          ctx.stroke();
        }
      }
    } else {
      drawTriangle(e.x, e.y, e.r);
      if (e.fearT > 0) ctx.fillStyle="purple";
      else if (e.burnT > 0) ctx.fillStyle="orange";
      else if (e.slowT > 0) ctx.fillStyle="skyblue";
      else ctx.fillStyle="red";
      ctx.fill();
    }
  }

  // 5) 탄환
  for (const b of bullets){
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle = b.tags.has("enemyshot") ? "#66ccff" : (b.r>=8 ? "#ffd400" : "#ddd");
    ctx.fill();
  }

  // 6) 플레이어
  ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fillStyle="white"; ctx.fill();

  // 7) 닌자 링(미니멀 표시)
  if (state.character === "ninja"){
    const range = 52 + Math.min(44, state.level*1.2);
    drawCircleStroke(player.x, player.y, range, {stroke:"#ffffff", alpha:0.25, lw:2});
    const a = state.ninjaBladeAngle;
    const x1 = player.x + Math.cos(a) * range;
    const y1 = player.y + Math.sin(a) * range;
    const x2 = player.x + Math.cos(a + Math.PI) * range;
    const y2 = player.y + Math.sin(a + Math.PI) * range;
    ctx.beginPath(); ctx.arc(x1,y1,4.5,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
    ctx.beginPath(); ctx.arc(x2,y2,4.5,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill();
  }

  // 8) 피격 플래시
  if (state.hurtFlash > 0){
    ctx.fillStyle = `rgba(255,0,0,${0.28*state.hurtFlash})`;
    ctx.fillRect(0,0,w,h);
  }

  // ✅ 9) XP는 “항상 최상단”(마지막에 그림)
  for (const o of xpOrbs){
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fillStyle="lime";
    ctx.fill();
  }

  // HUD
  document.getElementById("hud").innerHTML =
    `❤️ HP ${Math.floor(state.hp)}/${state.maxHp} ${state.shieldCharges>0?`(🛡${state.shieldCharges})`:""}<br>`+
    `⏱ ${state.time.toFixed(1)}초 · 스테이지 ${state.stage}/5 · 모드 ${state.stageMod ?? "-"}<br>`+
    `☠ 처치 ${state.kills}<br>`+
    `📈 Lv.${state.level} · XP ${state.xp}/${state.xpNeed}<br>`+
    `🧬 대기 원소 ${state.pendingEl?KR_EL[state.pendingEl]:"-"}<br>`+
    `✨ 시너지 ${summarizeSynergies()}<br>`+
    `🧩 장비 ${summarizeGears()}`;
}

/* =========================
   22) 루프
========================= */
let last=0;
function loop(t){
  const dt=Math.min(0.033, (t-last)/1000); // 모바일 안정
  last=t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================
   23) 시작/리셋/게임오버
========================= */
document.getElementById("pickRanged").onclick = () => startGame("ranged");
document.getElementById("pickNinja").onclick  = () => startGame("ninja");

function resetGame(){
  state.running=false;
  state.paused=false;

  state.time=300;
  state.elapsed=0;
  state.stage=1;
  state.stageMod=null;

  state.kills=0;
  state.level=1;
  state.xp=0;
  state.xpNeed=10;

  if (state.character==="ranged"){
    state.maxHp=100;
    state.ms=230;
    state.atk=12;
    state.as=3.0;
  } else {
    state.maxHp=150;  // 닌자 조금 낮춤(사기 방지)
    state.ms=205;
    state.atk=11;
    state.as=3.0;
  }
  state.hp=state.maxHp;

  state.pickupRadius=170;
  state.pickupForce=1200;

  state.hurtFlash=0;
  state.ifrT=0;
  state.freezeT=0;

  state.pendingEl=null;
  state.synergyStacks = new Map();
  state.gearLv = new Map();

  state.shieldCharges=0;
  state.shieldRegenT=0;
  state._bhCd=0;
  state._healCd=0;

  const w=W(), h=H();
  player.x=w/2; player.y=h/2;

  enemies.length=0; bullets.length=0; xpOrbs.length=0; items.length=0; fields.length=0; summons.length=0;

  // 초반 테스트용 몹
  for(let i=0;i<5;i++) spawnEnemy();
}

function startGame(charId){
  state.nickname = (document.getElementById("nameInput").value || "").trim() || "Player";
  state.character = charId;
  document.getElementById("start").style.display="none";
  resetGame();
  state.running = true;
  pickStageElites();
  rollStageModifier();
  showToast(`시작! (${charId==="ranged"?"원거리":"닌자"})`, 1.0);
}

const gameoverEl = document.getElementById("gameover");
document.getElementById("retryBtn").onclick = () => {
  gameoverEl.style.display="none";
  document.getElementById("start").style.display="flex";
};

document.getElementById("copyBtn").onclick = async () => {
  const payload = buildRunPayload();
  try{
    await navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
    showToast("복사됨!", 1.0);
  }catch{
    alert(JSON.stringify(payload, null, 2));
  }
};

function endGame(dead){
  state.running=false;
  document.getElementById("goTitle").textContent = dead ? "사망" : "5분 생존 성공";

  const payload = buildRunPayload();
  document.getElementById("goBody").textContent =
`닉네임: ${payload.nickname}
캐릭터: ${payload.character}
처치: ${payload.kills}
생존: ${payload.cleared}
레벨: ${payload.level}
시너지: ${payload.synergies.length ? payload.synergies.join(", ") : "-"}
장비: ${payload.gears.length ? payload.gears.join(", ") : "-"}`;

  gameoverEl.style.display="flex";
  // submitRun(payload); // Firebase 붙일 때 여기 연결
}

function buildRunPayload(){
  const synergies = [];
  for (const [k,lv] of state.synergyStacks.entries()) synergies.push(`${k}:${lv}`);
  const gears = [];
  for (const [k,lv] of state.gearLv.entries()) gears.push(`${k}:${lv}`);
  return {
    nickname: state.nickname,
    character: state.character,
    kills: state.kills,
    cleared: (state.time <= 0),
    level: state.level,
    timestamp: Date.now(),
    synergies,
    gears,
    version: "vFinal-mobile-minimal",
  };
}

/* =========================
   24) 보조: 2분 이후 템포
========================= */
setInterval(()=>{
  if (!state.running || state.paused) return;
  if (state.elapsed > 120 && Math.random() < 0.35){
    for(let i=0;i<3;i++) spawnEnemy();
  }
}, 6500);
</script>
</body>
</html>
